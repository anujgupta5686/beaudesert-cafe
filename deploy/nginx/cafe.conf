# Beaudesert Cafe — Nginx (EC2)
# Prefer same host for UI + /api (mobile-friendly). Certbot manages HTTPS blocks.
# Replace YOUR_DOMAIN e.g. beaudesertcafe.com

# Redirect www → apex (avoids split cookies / CORS flakes on phones)
server {
    listen 80;
    listen [::]:80;
    server_name www.YOUR_DOMAIN;
    return 301 https://YOUR_DOMAIN$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;

    root /home/ubuntu/apps/beaudesert-cafe/frontend/dist;
    index index.html;
    client_max_body_size 25M;

    location /api/ {
        proxy_pass http://127.0.0.1:5000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
